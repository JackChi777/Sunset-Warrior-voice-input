name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 也可以手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r pc/requirements.txt

      - name: 打包 EXE（不含模型，首次运行自动下载）
        run: python scripts/build_exe.py

      - name: 组装发布目录
        shell: bash
        run: |
          mkdir -p release
          cp dist/Sunset-Warrior.exe release/
          cp README.md release/README.md
          cp README.en.md release/README.en.md
          # 压缩成 zip（Windows 自带 tar 可用）
          cd release && tar -a -c -f ../Sunset-Warrior-win64.zip *

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: Sunset-Warrior-win64
          path: Sunset-Warrior-win64.zip

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Sunset-Warrior-win64.zip
          generate_release_notes: true
