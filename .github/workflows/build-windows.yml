name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # 也可以手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r pc/requirements.txt

      - name: 下载 SenseVoice 模型（约 163MB）
        shell: bash
        run: |
          model=sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
          url="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${model}.tar.bz2"
          mkdir -p voice-models
          echo "下载 $url"
          curl -L --fail --retry 3 --retry-delay 5 \
            -o "${TEMP}/model.tar.bz2" "$url"
          ls -la "${TEMP}/model.tar.bz2"
          echo "解压..."
          python -c "import tarfile; tarfile.open(r'${TEMP}/model.tar.bz2','r:bz2').extractall('voice-models')"
          test -f "voice-models/${model}/model.int8.onnx" && echo "模型就绪 ✓"

      - name: 打包 EXE
        run: python scripts/build_exe.py

      - name: 组装发布目录
        shell: bash
        run: |
          mkdir -p release
          cp dist/Sunset-Warrior.exe release/
          cp -r dist/voice-models release/voice-models
          cp README.md release/README.md
          # 压缩成 zip（Windows 自带 tar 可用）
          cd release && tar -a -c -f ../Sunset-Warrior-win64.zip *

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: Sunset-Warrior-win64
          path: Sunset-Warrior-win64.zip

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Sunset-Warrior-win64.zip
          generate_release_notes: true
