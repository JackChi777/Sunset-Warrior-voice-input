name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  syntax-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 语法检查（所有 Python 文件）
        run: python -m compileall -q pc scripts

      - name: 安装规则层依赖
        run: pip install jieba requests

      - name: 规则后处理冒烟测试
        working-directory: pc
        run: |
          python -X utf8 -c "
          from proofreading import proofread
          r = proofread('新华社报导了这件事，水份和成份都要核对', mode='none')
          assert '报道' in r.text, r.text
          assert '水分' in r.text, r.text
          assert '成分' in r.text, r.text
          print('规则后处理 OK:', r.text)
          "
